[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "template-video-renderer"
version = "0.1.0"
description = "Renders finished video files from a JSON scene description and a YAML template"
requires-python = ">=3.12"
dependencies = [
    "pillow>=11.0",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "ruff>=0.6",
    "mypy>=1.11",
]

[project.scripts]
template-video-renderer = "template_video_renderer.entrypoints.cli.main:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "N", "UP", "B", "SIM", "ERA"]

[tool.mypy]
python_version = "3.12"
strict = true
mypy_path = "src"
